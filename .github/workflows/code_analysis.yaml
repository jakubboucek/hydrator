name: Code Analysis

on:
    pull_request:
    push:

jobs:
    matrix:
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
                versions:
                    - name: highest
                      arg: highest
                      experimental: false
                    - name: lowest
                      arg: lowest
                      experimental: true
                actions:
                    - name: PHPStan
                      run: composer run phpstan
                    - name: Unit tests
                      run: composer run test

        runs-on: ubuntu-latest
        continue-on-error: ${{ matrix.versions.experimental }}
        name: ${{ matrix.actions.name }} at PHP ${{ matrix.php }} (${{ matrix.versions.name }})

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - uses: ramsey/composer-install@v4
              with:
                  dependency-versions: ${{ matrix.versions.arg }}

            - run: ${{ matrix.actions.run }}

    integration:
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']

        runs-on: ubuntu-latest
        name: Integration tests at PHP ${{ matrix.php }}

        services:
            mariadb:
                image: jakubboucek/lamp-devstack-mysql:10.6
                env:
                    MARIADB_DATABASE: hydrator_test
                    MARIADB_ROOT_PASSWORD: devstack
                    TZ: Europe/Prague
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="healthcheck.sh --connect --innodb_initialized"
                    --health-interval=5s
                    --health-timeout=3s
                    --health-retries=15

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  coverage: none

            - uses: ramsey/composer-install@v4
              with:
                  dependency-versions: highest

            - run: composer run test
              env:
                  DATABASE_DSN: mysql:host=127.0.0.1;port=3306;dbname=hydrator_test;charset=utf8mb4
                  DATABASE_USER: root
                  DATABASE_PASSWORD: devstack
