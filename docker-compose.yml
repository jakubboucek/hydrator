services:
    php:
        image: jakubboucek/lamp-devstack-php:8.4-cli
        environment:
            TZ: Europe/Prague
        working_dir: /var/www/html
        volumes:
            - ".:/var/www/html"

    php85:
        image: jakubboucek/lamp-devstack-php:8.5-cli
        environment:
            TZ: Europe/Prague
        working_dir: /var/www/html
        volumes:
            - ".:/var/www/html"
        profiles:
            - php85

    # Integration test database: `docker compose up -d mysqldb`, then run
    # tests with DATABASE_DSN (see CLAUDE.md). Data is ephemeral by design.
    mysqldb:
        image: jakubboucek/lamp-devstack-mysql:10.6
        environment:
            MARIADB_DATABASE: hydrator_test
            MARIADB_ROOT_PASSWORD: devstack
            TZ: Europe/Prague
        healthcheck:
            test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
            interval: 5s
            timeout: 3s
            retries: 15
